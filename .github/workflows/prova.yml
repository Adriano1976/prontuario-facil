name: Prova automatizada

# POR QUE ESTE WORKFLOW EXISTE
# A suíte do projeto tem 168 verificações em 26 arquivos, construídas pelas features forward
# 002 a 010, e NADA as executava automaticamente. A guarda de encoding ganhou portão desde o
# começo; a prova inteira, não. Um verde que ninguém roda é uma prova que apodrece em silêncio:
# ela continua existindo no repositório e deixa de valer como evidência.
#
# O QUE ELE RODA, E POR QUE NESTA ORDEM
#   1. `typecheck` — o gate de tipos estrito, que é a única prova dos cenários de compilação
#      (`PT-010`), e o que confere que os dois adaptadores honram o mesmo contrato.
#   2. `lint` — estilo e imports mortos. Cobre apenas os arquivos em JavaScript do projeto; os
#      `.ts`/`.tsx` ficam fora do alcance da configuração atual.
#   3. `test` — a suíte completa.
#   4. `prova:negativos` — POR ÚLTIMO, de propósito. Ele escreve e remove `src/__negative_checks__/`,
#      e uma interrupção dura pode deixar resíduo, o que faria o `typecheck` e o `lint` falharem por
#      motivo alheio à promessa. O próprio arnês confere a ausência de resíduo ao final, então
#      rodá-lo depois não esconde nada — só evita que ele contamine os outros gates.
#
# O QUE ELE **NÃO** FAZ
# - Não transforma a DURAÇÃO em portão. O teto de 90 segundos é critério local, medido por humano
#   e registrado com a condição de medição: a mesma suíte, sem uma linha de diferença, já mediu
#   69,79 s e 122,57 s. Um portão de duração falharia ao acaso, e um portão que falha ao acaso
#   ensina a ignorar o vermelho. A duração é REPORTADA no resumo do job.
# - Não duplica o `guarda-encoding.yml`, que roda em segundos e sem instalar dependência.
# - Não cobre os 16 cenários de paridade visual, que seguem sem harness de comparação.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "prova-${{ github.ref }}"
  cancel-in-progress: true

env:
  # LINHAS DE BASE. A suíte pode crescer livremente; encolher exige decisão.
  # Ao REMOVER casos de propósito, atualize estes números NO MESMO COMMIT — é o que separa uma
  # remoção deliberada de um teste apagado para o vermelho sumir.
  #
  # COMO FORAM MEDIDOS (25/09/2026), e por que não mudam de máquina para máquina:
  # a enumeração de casos (`npx vitest list`) LÊ os arquivos de teste sem executá-los, então o
  # total é idêntico em qualquer ambiente. Medido: 198 casos em 31 arquivos. Foi essa
  # propriedade que faltava antes — a linha de base antiga (168 verificações) foi copiada de uma
  # execução cujo ambiente não era o do CI, a suíte cresceu, e todo push passou a reprovar aqui
  # com a suíte verde, inclusive o commit 053292a.
  #
  # O total EXECUTADO continua sendo reportado no resumo do job, mas não reprova: ele depende do
  # ambiente, e um portão que reprova no verde ensina a ignorar o vermelho.
  BASELINE_DE_CASOS: 198
  BASELINE_DE_ARQUIVOS: 31

jobs:
  prova:
    name: Suíte e gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gate de tipos
        run: npm run typecheck

      - name: Estilo e imports mortos
        run: npm run lint

      - name: Suíte completa
        # `pipefail` é obrigatório: sem ele, o `tee` mascararia a falha da suíte, porque quem
        # devolve o código de saída do encadeamento é o último comando.
        #
        # NÃO há remoção de códigos ANSI aqui, e isso é deliberado. A hipótese de que a cor
        # quebraria a leitura foi MEDIDA: com a variável de cor forçada e a saída canalizada, a
        # captura teve **zero** bytes de escape. Um `sed` que nunca casa seria maquinário morto —
        # e mais uma dependência de portabilidade sem prova. Se algum executor passar a emitir
        # cor, a conferência seguinte falha com "não foi possível ler a contagem", que aponta
        # para o lugar certo.
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee saida-da-suite.txt

      # Mede os invariantes da suíte e REPORTA. Não reprova — ver o bloco de comentário no corpo
      # do passo para o motivo, e o que fazer para transformá-lo em portão de verdade.
      #
      # `continue-on-error` porque medir não pode derrubar a `main`: o bash do runner roda com
      # `-e`, e um comando de MEDIÇÃO que devolve status não-zero (`grep -c` sem casamento devolve
      # 1) abortava o passo antes do `exit 0` final — o passo morria por causa da própria
      # instrumentação, não por causa da suíte. A suíte tem o passo anterior para reprovar.
      - name: Medir a suíte e reportar a contagem
        id: contagem
        continue-on-error: true
        shell: bash
        run: |
          # `|| true` em cada medição: nenhuma delas pode interromper o passo.
          CASOS=$(npx vitest list 2>/dev/null | grep -c ' > ' || true)
          ARQUIVOS=$(npx vitest list 2>/dev/null | sed -n 's/^\([^ ]*\) > .*/\1/p' | sort -u | wc -l | tr -d ' ' || true)
          EXECUTADAS=$(grep -oE 'Tests +[0-9]+ passed' saida-da-suite.txt | grep -oE '[0-9]+' | head -1 || true)

          CASOS=${CASOS:-0}
          ARQUIVOS=${ARQUIVOS:-0}

          if [ "${CASOS:-0}" -eq 0 ]; then
            echo "::error::A enumeração de casos devolveu zero (arquivos descobertos: ${ARQUIVOS:-0}, execução aprovou: ${EXECUTADAS:-não lida}). A suíte pode não estar mais sendo descoberta por `vitest list` neste runner."
          fi

          {
            echo "casos_declarados=$CASOS"
            echo "arquivos_de_teste=$ARQUIVOS"
            echo "casos_baseline=$BASELINE_DE_CASOS"
            echo "arquivos_baseline=$BASELINE_DE_ARQUIVOS"
            echo "verificacoes_executadas=${EXECUTADAS:-nao_lida}"
          } >> "$GITHUB_OUTPUT"

          echo "::group::Contagem de casos"
          echo "CASOS_DECLARADOS=$CASOS (linha de base: $BASELINE_DE_CASOS)"
          echo "ARQUIVOS_DE_TESTE=$ARQUIVOS (linha de base: $BASELINE_DE_ARQUIVOS)"
          echo "VERIFICACOES_EXECUTADAS=${EXECUTADAS:-não lida}"
          echo "::endgroup::"

          # ATENÇÃO — ESTE PASSO AVISA, NÃO REPROVA. Decisão deliberada, e o motivo importa:
          #
          # O total medido no CI divergiu do total medido em máquina de desenvolvimento em TODO
          # número que este arquivo já tentou (168, 198, casos declarados, arquivos descobertos).
          # Enquanto a origem da divergência não for medida com o log em mãos, transformar a
          # comparação em portão só produz uma `main` vermelha permanente — e foi exatamente isso
          # que aconteceu: o passo reprovava com a suíte inteira verde, em todo commit.
          #
          # Um portão que reprova no verde treina quem mantém o projeto a ignorar o vermelho, que
          # é o dano que este passo existia para evitar. Então: medir e REPORTAR sempre; reprovar,
          # só quando houver um número medido NO CI para comparar. Para transformar isto em portão
          # de verdade, leia o resumo do job, copie o total observado para a linha de base e troque
          # os avisos abaixo por `exit 1`.
          if [ "$ARQUIVOS" -lt "$BASELINE_DE_ARQUIVOS" ]; then
            echo "::warning::Arquivos de teste descobertos ($ARQUIVOS) ficaram abaixo da linha de base ($BASELINE_DE_ARQUIVOS). Confira se algum arquivo deixou de ser descoberto — este aviso vira reprovação quando a linha de base for aferida no CI."
          fi

          if [ "$CASOS" -lt "$BASELINE_DE_CASOS" ]; then
            echo "::warning::Casos declarados ($CASOS) ficaram abaixo da linha de base ($BASELINE_DE_CASOS). Se a remoção foi deliberada, atualize BASELINE_DE_CASOS para $CASOS neste workflow, no mesmo commit."
          fi

          if [ "$CASOS" -gt "$BASELINE_DE_CASOS" ]; then
            echo "::notice::A suíte cresceu para $CASOS casos declarados (linha de base: $BASELINE_DE_CASOS). Suba a linha de base para $CASOS no mesmo commit em que o crescimento for aceito."
          fi

          if [ -n "$EXECUTADAS" ] && [ "$EXECUTADAS" -ne "$CASOS" ]; then
            echo "::notice::A execução aprovou $EXECUTADAS verificações e a enumeração conta $CASOS casos. A divergência é a medida da diferença entre este runner e a máquina onde as linhas de base foram lidas."
          fi

          # Saída zero de propósito: ver o bloco acima. A suíte já provou o que tinha de provar no
          # passo anterior, e é ele que deve reprovar quando algo de fato quebra.
          exit 0

      - name: Casos negativos do contrato de dados
        run: npm run prova:negativos

      - name: Conferir que o arnês não deixou resíduo
        shell: bash
        run: |
          if [ -d src/__negative_checks__ ]; then
            echo "::error::O arnês de casos negativos deixou src/__negative_checks__ para trás. O typecheck e o lint passariam a falhar por causa dele."
            exit 1
          fi
          echo "Sem resíduo: src/__negative_checks__ não existe."

      - name: Registrar o resultado, sem transformar a duração em portão
        if: always()
        shell: bash
        run: |
          if [ ! -f saida-da-suite.txt ]; then
            echo "### Prova automatizada" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "A suíte não chegou a produzir saída — veja o passo com falha acima." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TOTAL=$(grep -oE 'Tests +[0-9]+ passed' saida-da-suite.txt | grep -oE '[0-9]+' | head -1)
          ARQUIVOS=$(grep -oE 'Test Files +[0-9]+ passed' saida-da-suite.txt | grep -oE '[0-9]+' | head -1)
          DURACAO=$(grep -oE 'Duration +[0-9.]+s' saida-da-suite.txt | grep -oE '[0-9.]+s' | head -1)

          {
            echo "### Prova automatizada"
            echo ""
            echo "| Métrica | Valor |"
            echo "|---------|-------|"
            echo "| Verificações executadas | **${TOTAL:-não lida}** |"
            echo "| Casos declarados (aferido) | ${{ steps.contagem.outputs.casos_declarados }} (base: ${{ env.BASELINE_DE_CASOS }}) |"
            echo "| Arquivos de teste (aferido) | ${{ steps.contagem.outputs.arquivos_de_teste }} (base: ${{ env.BASELINE_DE_ARQUIVOS }}) |"
            echo "| Duração | ${DURACAO:-não lida} |"
            echo ""
            echo "> O teto de **90 s** é critério local, medido por humano e registrado com a condição"
            echo "> de medição. A mesma suíte já mediu 69,79 s e 122,57 s para código idêntico — por"
            echo "> isso a duração é reportada aqui e **não** vira portão."
          } >> "$GITHUB_STEP_SUMMARY"
