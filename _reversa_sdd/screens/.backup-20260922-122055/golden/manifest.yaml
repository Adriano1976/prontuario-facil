# golden/manifest.yaml
#
# Manifesto dos golden files emitidos pelo Screen Translator. O Inspector consome
# este arquivo para construir parity tests construtivos quando o oráculo legado
# está disponível e a captura foi possível.
#
# Nesta migração: origem ≡ alvo em plataforma (React → React+TS). O "oráculo" é a
# própria SPA legada rodando em modo offline (VITE_OFFLINE=true), executável via
# `npm run dev`. Captura automatizada é OQ-02 (v2); aqui ficam comandos sugeridos
# para captura manual de screenshots. present: false para todos — o Inspector não
# depende de golden files nesta migração (paridade visual é por construção).

schemaVersion: 1
generatedAt: 2026-09-09T15:52:00-03:00
reversa:
  version: "1.3.2"
producedBy: screen-translator
sourcePlatform: react-hooks
targetPlatform: web-spa
oracleAvailable: true
oracleHash: null
oracleCommand: "npm run dev (VITE_OFFLINE=true) e abrir a SPA no navegador"

normalizationRules:
  - lineEndings: "\n"
  - trimTrailingSpaces: false
  - stripAnsiColors: false
  - normalizeUtf8: true
  - injectClock: null        # SPA com dados dinâmicos; captura manual por tela
  - seedRandom: null

