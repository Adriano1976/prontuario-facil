#
# Manifesto dos golden files emitidos pelo Screen Translator.
#
# ESTA EDIÇÃO (2026-09-22) substitui a de 2026-09-09, em que TODAS as 16 telas
# estavam com present: false ("captura dourada de referência não existe no
# repositório"). O usuário capturou as telas do legado manualmente e as 23
# imagens passaram a existir em _reversa_sdd/screens/golden/.
#
# ── DECISÃO HUMANA QUE GOVERNA ESTE ARQUIVO (2026-09-22) ─────────────────────
# As capturas formam um conjunto HETEROGÊNEO: 5 larguras distintas (1314, 1443,
# 1460, 1623, 1732), 15 alturas distintas, seis capturas de página inteira e uma
# montagem com rolagem. As normalizationRules abaixo NÃO corrigem viewport nem
# resolução. O humano decidiu: aceitar o conjunto misto e declarar que a
# paridade sustentada por estes goldens é CONSTRUTIVA/SEMÂNTICA (a tela existe,
# com os mesmos componentes, textos, hierarquia e estados), NÃO comparação
# pixel a pixel. Ver screen_deviation_log.md → DEV-001 e DEV-002.
#
# ── EXTENSÕES DESTE MANIFESTO AO TEMPLATE ───────────────────────────────────
# Três campos foram acrescentados por tela, para rastreabilidade:
#   parityScenario: "PT-Vnn" quando a tela tem cenário em
#                   migration/parity_tests/screens/, ou null quando não tem
#   sourceCapture:  caminho da captura original entregue pelo usuário
#   dimensions:     WxH do golden, para transparência sobre a heterogeneidade
#
# Para telas sem cenário V (as "extras"), parityScenario é null e o campo notes
# diz explicitamente que não há cenário de paridade correspondente.

